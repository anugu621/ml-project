<html>
<body>
    <div class="login">
        <h1>Student Exam Performance Indicator</h1>

        <form action="{{ url_for('predict_datapoint') }}" method="post">
            <h1>
                <legend>Student Exam Performance Prediction</legend>
            </h1>
            <div class="mb-3">
                <label class="from-label">Gender</label>
                <select class="form-control" name="gender" Placeholder="Enter your Gender" required>
                    <option class="Placeholder" selected disabled value=="">Select your Gender</option>
                    <option value="male">
                        male 
                    </option>
                    <option value="female">
                        female
                    </option>
                </select>
            </div>
            <div class="mb-3">
                <label class="from-label">Race or Ethnicity</label>
                <select class="form-control" name="ethnicity" Placeholder="Enter your ethnicity" required>
                    <option class="Placeholder" selected disabled value=="">Select Ethnicity</option>
                    <option value="group A">
                        group A 
                    </option>
                    <option value="group B">
                        group B     
                    </option>
                    <option value="group C">
                        group C
                    </option>
                    <option value="group D">
                        group D
                    </option>
                    <option value="group E">
                        group E
                    </option>
                </select>
            </div>
            <div class="mb-3">
                <label class="from-label">Parental Level of Education</label>
                <select class="form-control" name="parental_level_of_education" 
                    Placeholder=""Enter your Parental Education" required>     
                    <option class="Placeholder" selected disabled value=="">Select Parental Education</option>
                    <option value="associate's degree">
                        associate's degree
                    </option>
                    <option value="bachelor's degree">
                        bachelor's degree
                    </option>
                    <option value="master's degree">
                        master's degree
                    </option>
                    <option value="high school">
                        high school
                    </option>
                    <option value="some college">
                        some college
                    </option>
                </select>
            </div>
            <div class="mb-3">
                <label class="from-label">Lunch Type</label>
                <select class="form-control" name="lunch" Placeholder="Enter your Lunch" required>
                    <option class="Placeholder" selected disabled value=="">Select Lunch Type</option>
                    <option value="standard">
                        standard
                    </option>
                    <option value="free/reduced">
                        free/reduced
                    </option>
                </select>
            </div>
            <div class="mb-3">
                <label class="from-label">Test Preparation Course</label>
                <select class="form-control" name="test_preparation_course" Placeholder="Enter your Test Preparation Course"
                     required>
                    <option class="Placeholder" selected disabled value=="">Select Test_Course</option>
                    <option value="none">
                        none
                    </option>
                    <option value="completed">
                        completed
                    </option>
                </select>
            </div>
            <div class="mb-3">
                <label class="from-label">Writing score out of 100</label>
                <input class="form-control" type="number" name="writing_score" 
                    Placeholder="Enter your Writing Score" min='0' max='100' />

            </div>
            <div class="mb-3">
                <label class="from-label">Reading score out of 100</label>
                <input class="form-control" type="number" name="reading_score" 
                    Placeholder="Enter your Reading Score" min='0' max='100' /> 
            </div>          
            <div class="mb-3">
                <input class="btn btn-primary" type="submit" value="Predict your Math Score" required/>
            </div>
        </form>
        <h2>
            THE Prediction is{{results}}
        </h2>
    <body>
</html>
